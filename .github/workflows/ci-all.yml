name: CI - All Services

on:
  push:
    branches:
      - main
      - develop
      - staging
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop
      - staging
      - 'feature/**'

jobs:
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev_catalyst_front

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dev_catalyst_front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

  backend:
    name: Backend (Rails)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev_catalyst_rails

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: dev_catalyst
          POSTGRES_PASSWORD: password
          POSTGRES_DB: dev_catalyst_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: dev_catalyst_rails

      - name: RuboCop
        run: bundle exec rubocop --parallel

      - name: Setup Database
        run: |
          bundle exec rails db:create RAILS_ENV=test
          bundle exec rails db:schema:load RAILS_ENV=test
        env:
          DATABASE_URL: postgresql://dev_catalyst:password@localhost:5432/dev_catalyst_test

      - name: RSpec
        run: bundle exec rspec
        env:
          DATABASE_URL: postgresql://dev_catalyst:password@localhost:5432/dev_catalyst_test
          RAILS_ENV: test

  ai-service:
    name: AI Service (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev_catalyst_fastapi

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: dev_catalyst_fastapi/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Black format check
        run: black --check .

      - name: isort check
        run: isort --check-only .

      - name: Flake8
        run: flake8 .

      - name: MyPy
        run: mypy app/ --ignore-missing-imports

      - name: Pytest
        run: pytest --cov=app --cov-report=xml
        env:
          RAILS_BACKEND_URL: http://localhost:3001
          JWT_SECRET_KEY: test_secret_key
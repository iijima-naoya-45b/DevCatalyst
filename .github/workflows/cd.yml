name: CD - Deploy

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

jobs:
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    defaults:
      run:
        working-directory: dev_catalyst_front

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dev_catalyst_front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_AI_API_URL: ${{ secrets.NEXT_PUBLIC_AI_API_URL }}

      - name: Deploy to Vercel (production)
        uses: amondnet/vercel-action@v25
        if: github.ref == 'refs/heads/main'
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: dev_catalyst_front
          vercel-args: '--prod'
      - name: Deploy to Vercel (staging)
        uses: amondnet/vercel-action@v25
        if: github.ref == 'refs/heads/staging'
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN_STAGING || secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_STAGING || secrets.VERCEL_PROJECT_ID }}
          working-directory: dev_catalyst_front
          # stagingはpreviewデプロイ（--prodは付けない）

  deploy-backend:
    name: Deploy Backend (Rails)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    defaults:
      run:
        working-directory: dev_catalyst_rails

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: dev_catalyst_rails

      - name: Deploy to Heroku (production)
        uses: akhileshns/heroku-deploy@v3.13.15
        if: github.ref == 'refs/heads/main'
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: ${{ secrets.HEROKU_APP_NAME }}
          heroku_email: ${{ secrets.HEROKU_EMAIL }}
          appdir: dev_catalyst_rails
      - name: Deploy to Heroku (staging)
        uses: akhileshns/heroku-deploy@v3.13.15
        if: github.ref == 'refs/heads/staging'
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY_STAGING || secrets.HEROKU_API_KEY }}
          heroku_app_name: ${{ secrets.HEROKU_APP_NAME_STAGING }}
          heroku_email: ${{ secrets.HEROKU_EMAIL }}
          appdir: dev_catalyst_rails

  deploy-ai-service:
    name: Deploy AI Service (FastAPI)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    defaults:
      run:
        working-directory: dev_catalyst_fastapi

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Deploy to Railway (production)
        run: |
          echo "Deploy to Railway or your preferred platform"
          # Add your deployment commands here
        if: github.ref == 'refs/heads/main'
      - name: Deploy to Railway (staging)
        run: |
          echo "Deploy to Railway (staging) or your preferred platform"
          # Add your staging deployment commands here
        if: github.ref == 'refs/heads/staging'
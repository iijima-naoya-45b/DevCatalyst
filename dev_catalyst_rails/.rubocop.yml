plugins:
  - rubocop-rails
  - rubocop-performance

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.2
  SuggestExtensions: false
  Exclude:
    - 'bin/**/*'
    - 'db/schema.rb'
    - 'db/migrate/**/*'
    - 'node_modules/**/*'
    - 'vendor/**/*'
    - 'tmp/**/*'
    - 'log/**/*'
    - 'public/**/*'
    - 'config/environments/**/*'
    - 'config/initializers/devise.rb'

# Layout
Layout/LineLength:
  Max: 160
  Exclude:
    - 'config/**/*'

Layout/MultilineMethodCallIndentation:
  EnforcedStyle: indented

# Style
Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/HashSyntax:
  EnforcedStyle: ruby19

Style/SymbolArray:
  EnforcedStyle: brackets

Style/WordArray:
  EnforcedStyle: brackets

# Metrics
Metrics/MethodLength:
  Max: 80
  Exclude:
    - 'db/seeds.rb'

Metrics/BlockLength:
  Max: 50
  Exclude:
    - 'config/routes.rb'
    - 'config/environments/**/*'
    - 'spec/**/*'
    - 'test/**/*'
    - 'db/**/*.rb'

Metrics/ClassLength:
  Max: 500

Metrics/ModuleLength:
  Max: 500

Metrics/AbcSize:
  Max: 80

Metrics/PerceivedComplexity:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

# Naming - 緩和
Naming/MethodName:
  Enabled: false

Naming/VariableName:
  Enabled: false

Naming/MethodParameterName:
  Enabled: false

Naming/AccessorMethodName:
  Enabled: false

Naming/PredicatePrefix:
  Enabled: false

# Rails
Rails/I18nLocaleTexts:
  Enabled: false

Rails/OutputSafety:
  Enabled: true

Rails/SkipsModelValidations:
  Enabled: false

# Performance
Performance/StringReplacement:
  Enabled: true

Performance/RedundantMerge:
  Enabled: true

# Style
Style/ComparableClamp:
  Enabled: false

Lint/UnusedMethodArgument:
  Enabled: false

Lint/DuplicateBranch:
  Enabled: false